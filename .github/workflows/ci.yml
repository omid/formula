name: ci

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Format
        run: |
          cargo fmt -- --check
      - name: Linting
        run: |
          cargo clippy --all-targets -- -D warnings
      - name: Cargo Doc
        run: |
          cargo doc --no-deps --all-features --examples

  test:
    needs: lints
    runs-on: ${{ matrix.target.os }}
    name: ${{ matrix.target.name }} / ${{ matrix.version }}
    strategy:
      matrix:
        target:
        - { name: Linux, os: ubuntu-latest, triple: x86_64-unknown-linux-gnu }
        - { name: macOS, os: macos-latest, triple: aarch64-apple-darwin }
        - { name: Windows, os: windows-2022, triple: x86_64-pc-windows-msvc }
        version:
        - 1.99.0 # MSRV
        - stable
        - nightly
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.version }}-${{ matrix.target.triple }}
          override: true
      - name: Run tests
        run: |
          cargo test --all-features --all-targets

  wasm:
    needs: lints
    runs-on: ubuntu-latest
    name: WASM / Node
    steps:
      - uses: actions/checkout@v5
      - name: Install stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install wasm-bindgen's test runner
        run: |
          cargo generate-lockfile
          # the runner must have the same version as the wasm-bindgen crate
          version=$(cargo pkgid wasm-bindgen | cut -d@ -f2)
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Run tests
        run: |
          make test_wasm

  audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit
        run: |
          cargo update
          cargo audit
        continue-on-error: true
